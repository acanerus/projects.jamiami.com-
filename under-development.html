<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Development — JA Miami Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f7f8fa;
    color: #1f2430;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #ffffff;
    border-bottom: 1px solid #e7e9ee;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #0a2a6b, #1a56db);
    border-radius: 8px;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: #0a2a6b;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #6b7280;
  }

  .back-link {
    font-size: 14px;
    font-weight: 600;
    color: #1a56db;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  main {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
  }

  .status-badge {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #1a56db;
    background: #eaf0fe;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .page-title {
    font-size: 34px;
    font-weight: 800;
    color: #0a2a6b;
    margin: 0 0 12px;
  }

  .page-sub {
    font-size: 15.5px;
    color: #6b7280;
    line-height: 1.6;
    margin: 0 0 36px;
  }

  .back-cta {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    background: #0a2a6b;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .back-cta:hover { background: #1a56db; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <h1>JA Miami Projects</h1>
      <p>Internal project hub</p>
    </div>
  </div>
  <a class="back-link" href="/">← All Projects</a>
</header>

<main>
  <span class="status-badge">In progress</span>
  <p class="page-title">Under Development</p>
  <p class="page-sub">This project page isn't ready yet. Check back soon — in the meantime, head back to the project directory to browse what's already live.</p>
  <a class="back-cta" href="/">← Back to All Projects</a>
</main>

</body>
</html>
